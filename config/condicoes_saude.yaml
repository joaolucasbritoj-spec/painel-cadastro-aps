# Condições de saúde extraídas de CONDICOES DE SAUDE — mesmos ~20 padrões
# (regex) já usados em gerar_relatorio.py, sem reescrever a lógica: só
# trouxemos a mesma lista para cá, como configuração.
#
# Serve para duas coisas no painel:
#   1. Mostrar a distribuição por equipe (% de cadastros com cada condição).
#   2. Gerar um "alerta de plausibilidade": uma condição registrada em ZERO
#      cadastros de uma equipe grande o suficiente é estatisticamente
#      improvável e quase sempre indica que o campo não está sendo
#      preenchido no atendimento — não que "ninguém tem". Isso vira uma
#      pergunta no painel (ex.: "Ninguém tem Internação nos últimos 12
#      meses registrada — confira o preenchimento?").
#
# Como decidir "suspeito" sem inventar uma taxa clínica esperada para cada
# condição (não temos essa referência documentada, exceto gestantes):
#   - Regra padrão: ZERO casos numa equipe com pelo menos
#     `minimo_cadastros_para_alerta` cadastros ativos.
#   - Exceção: quando a condição tem `taxa_esperada_min_pct` preenchido
#     (hoje só gestantes, com fonte DATASUS/SINASC já usada no script
#     atual), o alerta usa essa taxa mínima em vez de exigir zero absoluto.

minimo_cadastros_para_alerta: 300

condicoes:
  - id: has
    nome: "Hipertensão (HAS)"
    regra: {tipo: contem, coluna: cond_saude, texto: "HIPERTENSO"}
  - id: diabetes
    nome: "Diabetes (DM)"
    regra: {tipo: contem, coluna: cond_saude, texto: "DIABETES"}
